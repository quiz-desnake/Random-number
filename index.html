<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Random Generator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at top left, #6c63ff, transparent 35%),
                radial-gradient(circle at bottom right, #00c6ff, transparent 35%),
                #0f172a;

            color: white;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 450px;
            padding: 35px;

            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.15);

            backdrop-filter: blur(20px);

            border-radius: 25px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.4);

            text-align: center;
        }

        .icon {
            font-size: 55px;
            margin-bottom: 10px;

            animation: rotate 3s infinite linear;
        }

        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .description {
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        .inputs {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-group {
            flex: 1;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #e2e8f0;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;

            border: none;
            outline: none;

            border-radius: 12px;

            font-size: 16px;

            background: rgba(255, 255, 255, 0.95);
            color: #111827;
        }

        input:focus {
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.5);
        }

        button {
            width: 100%;
            padding: 15px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #6366f1,
                #8b5cf6
            );

            color: white;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.25s;
        }

        button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 10px 30px rgba(99, 102, 241, 0.4);
        }

        button:active {
            transform: scale(0.97);
        }

        .result {
            margin-top: 25px;
            padding: 25px;

            border-radius: 18px;

            background: rgba(0, 0, 0, 0.20);

            display: none;
        }

        .result.show {
            display: block;

            animation: appear 0.4s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .result-text {
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 10px;
        }

        #number {
            font-size: 60px;
            font-weight: bold;

            background: linear-gradient(
                90deg,
                #60a5fa,
                #c084fc
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .error {
            color: #fca5a5;
            margin-top: 15px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #94a3b8;
        }

        @media (max-width: 500px) {

            .container {
                padding: 25px;
            }

            .inputs {
                flex-direction: column;
            }

            h1 {
                font-size: 27px;
            }

            #number {
                font-size: 50px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">🎲</div>

        <h1>Random Generator</h1>

        <p class="description">
            Istalgan oraliqdan tasodifiy son tanlang
        </p>

        <div class="inputs">

            <div class="input-group">
                <label>Minimum</label>

                <input
                    type="number"
                    id="min"
                    placeholder="1"
                >
            </div>

            <div class="input-group">
                <label>Maximum</label>

                <input
                    type="number"
                    id="max"
                    placeholder="100"
                >
            </div>

        </div>

        <button onclick="generateRandom()">
            🎲 Generate
        </button>

        <div class="error" id="error">
            ❌ Minimum maksimumdan katta bo'lishi mumkin emas!
        </div>

        <div class="result" id="result">

            <div class="result-text">
                Sizning random soningiz:
            </div>

            <div id="number">
                0
            </div>

        </div>

        <div class="footer">
            ✨ Simple Random Number Generator
        </div>

    </div>


    <script>

        function generateRandom() {

            const minInput = document.getElementById("min");
            const maxInput = document.getElementById("max");

            const result = document.getElementById("result");
            const number = document.getElementById("number");
            const error = document.getElementById("error");

            const min = Number(minInput.value);
            const max = Number(maxInput.value);

            // Xatoni yashirish
            error.classList.remove("show");

            // Sonlar kiritilganini tekshirish
            if (
                minInput.value === "" ||
                maxInput.value === ""
            ) {
                error.textContent =
                    "❌ Iltimos, minimum va maksimumni kiriting!";

                error.classList.add("show");

                return;
            }

            // Minimum maksimumdan katta bo'lsa
            if (min > max) {

                error.textContent =
                    "❌ Minimum maksimumdan katta bo'lishi mumkin emas!";

                error.classList.add("show");

                return;
            }

            // Random son
            const randomNumber =
                Math.floor(
                    Math.random() * (max - min + 1)
                ) + min;

            // Natijani chiqarish
            number.textContent = randomNumber;

            result.classList.remove("show");

            // Animatsiyani qayta ishga tushirish
            setTimeout(() => {
                result.classList.add("show");
            }, 10);
        }

    </script>

</body>
</html>
